# Server Configuration
server.port=8081
spring.application.name=Registration Form API

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/registrationform_db
spring.datasource.username=isnendyankp
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration (untuk debugging)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
# Set JWT_SECRET as an environment variable for any real deployment — this fallback is
# for local dev only and must never be used in production.
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-set-JWT_SECRET-env-var}
jwt.expiration=86400000

# File Upload Configuration
# Maximum file size for single file upload (5MB)
spring.servlet.multipart.max-file-size=5MB
# Maximum total request size (in case of multiple files, though we only use single)
spring.servlet.multipart.max-request-size=5MB
# Enable multipart file upload support
spring.servlet.multipart.enabled=true

# Profile Picture Storage
# Directory for storing uploaded profile pictures (relative to application root)
file.upload.directory=uploads/profiles/
# Base URL for accessing uploaded files (path stored in database, frontend adds /uploads/ prefix)
file.upload.base-url=profiles/

# Gallery Photo Storage
# Directory for storing gallery photos (relative to application root)
# Photos stored in user subdirectories: uploads/gallery/user-{userId}/photo-{photoId}-{timestamp}.jpg
file.gallery.directory=uploads/gallery/
# Base URL for accessing gallery photos
file.gallery.base-url=gallery/